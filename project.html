<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaaS Architecture Diagram (Compact Dark Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    >
    <style>
    body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: #e2e8f0; /* Slate 200 */
        overflow: hidden; 
    }

    .node-box {
        transition: all 0.3s ease;
    }
    .node-box:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.5); /* Slightly smaller shadow */
    }

    /* Traefik Section */
    .traefik-area {
        background-color: rgba(239, 68, 68, 0.15); /* Red-500 with low opacity */
        border: 2px solid #ef4444;
        border-radius: 20px; /* Reduced radius */
    }

    /* BaaS Project Section */
    .baas-area {
        background-color: rgba(16, 185, 129, 0.1); /* Emerald-500 with low opacity */
        border: 2px solid #10b981;
        border-radius: 28px; /* Reduced radius */
    }

    /* Connection Lines SVG */
    #connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .connection-path {
        fill: none;
        stroke: #60a5fa; /* Blue-400 */
        stroke-width: 2;
        filter: drop-shadow(0 0 2px rgba(96, 165, 250, 0.5));
    }

    .arrow-head {
        fill: #60a5fa;
    }
    </style>
  </head>
  <body class="w-full h-screen flex flex-col items-center justify-center relative bg-gray-900">
    <!-- Title and Description -->
    <div class="absolute top-4 left-4 z-20">
      <h1 class="text-xl font-bold text-white mb-1">
        BaaS Architecture Platform
      </h1>
      <p class="text-gray-400 text-xs">
        WKE Drive Case Study（Compact Dark Mode）
      </p>
    </div>

    <!-- Main Canvas - Reduced height from 600px to 450px, and padding from p-8 to p-4 -->
    <div
      id="main-container"
      class="relative w-full max-w-5xl h-[450px] flex items-center justify-center p-4"
    >
      <!-- SVG Layer for arrows -->
      <svg id="connections" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker
            id="arrowhead"
            markerWidth="10"
            markerHeight="7"
            refX="9"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
          </marker>
        </defs>
        <!-- Paths will be generated by JS -->
      </svg>

      <!-- BaaS Project Container (Green) - Reduced padding from p-12 to p-6 -->
      <div
        id="baas-project"
        class="baas-area relative w-full h-full flex flex-row items-center justify-between p-6 z-10"
      >
        <!-- Label for BaaS Project - Reduced text size from xl to lg -->
        <div class="absolute bottom-3 left-1/2 transform -translate-x-1/2 text-emerald-400 font-bold text-lg tracking-wider">
          BaaS Project
        </div>

        <!-- Left: Traefik Container (Red) - Reduced padding from p-6 to p-4 and gap from gap-6 to gap-3 -->
        <div
          id="traefik-container"
          class="traefik-area w-1/3 h-full flex flex-col justify-center items-center p-4 gap-3 relative"
        >
          <!-- Items inside Traefik - Reduced vertical padding from py-3 to py-2 -->
          <div
            id="node-db-port"
            class="node-box bg-slate-800 border border-blue-500/50 text-blue-200 px-4 py-2 rounded-xl w-full text-center shadow-lg font-mono text-xs break-all relative z-20 cursor-default"
          >
            &lt;ref&gt;.baas.wke.:5432
          </div>

          <div
            id="node-auth-api"
            class="node-box bg-slate-800 border border-blue-500/50 text-blue-200 px-4 py-2 rounded-xl w-full text-center shadow-lg font-mono text-xs break-all relative z-20 cursor-default"
          >
            &lt;ref&gt;.baas.wke./api/auth
          </div>

          <div
            id="node-rest-api"
            class="node-box bg-slate-800 border border-blue-500/50 text-blue-200 px-4 py-2 rounded-xl w-full text-center shadow-lg font-mono text-xs break-all relative z-20 cursor-default"
          >
            &lt;ref&gt;.baas.wke./api/rest
          </div>

          <!-- Label for Traefik - Reduced text size from 2xl to xl -->
          <div class="absolute bottom-2 text-red-400 font-bold text-xl tracking-widest font-sans">
            træfik
          </div>
        </div>

        <!-- Middle: Services - Reduced gap from gap-16 to gap-8 and horizontal padding from px-4 to px-2 -->
        <div class="w-1/4 h-full flex flex-col justify-center gap-8 px-2">
          <!-- Service Boxes - Reduced vertical padding from py-6 to py-4 and text size to base -->
          <div
            id="service-auth"
            class="node-box bg-blue-900/40 border border-blue-400 text-blue-100 px-4 py-4 rounded-xl w-full text-center shadow-lg text-base font-semibold relative z-20 backdrop-blur-sm"
          >
            Better Auth
          </div>

          <div
            id="service-postgrest"
            class="node-box bg-blue-900/40 border border-blue-400 text-blue-100 px-4 py-4 rounded-xl w-full text-center shadow-lg text-base font-semibold relative z-20 backdrop-blur-sm"
          >
            PostgREST
          </div>
        </div>

        <!-- Right: Database -->
        <div class="w-1/4 h-full flex flex-col justify-center items-center">
          <div
            id="postgres-db"
            class="flex flex-col items-center justify-center relative z-20"
          >
            <!-- SVG Database Icon - Reduced width/height from 120 to 90 -->
            <svg
              width="90"
              height="90"
              viewBox="0 0 100 100"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="drop-shadow-xl filter drop-shadow-[0_10px_8px_rgba(0,0,0,0.5)]"
            >
              <!-- Bottom Layer: Adjusted from 35/75 to 25/85 to increase height -->
              <path
                d="M10 25 V 85 C 10 95, 90 95, 90 85 V 25"
                fill="url(#db-gradient)"
                stroke="#2563eb"
                stroke-width="2"
              />

              <!-- Middle Line 1: Adjusted from 50 to 45 -->
              <path
                d="M10 45 C 10 55, 90 55, 90 45"
                fill="none"
                stroke="#60a5fa"
                stroke-width="1"
                stroke-opacity="0.5"
              />

              <!-- Middle Line 2: Adjusted from 65 to 65 (25+40, consistent) -->
              <path
                d="M10 65 C 10 75, 90 75, 90 65"
                fill="none"
                stroke="#60a5fa"
                stroke-width="1"
                stroke-opacity="0.5"
              />

              <!-- Top Lid: Adjusted cy from 35 to 25, ry from 11 to 10 -->
              <ellipse
                cx="50"
                cy="25"
                rx="40"
                ry="10"
                fill="#60a5fa"
                stroke="#2563eb"
                stroke-width="2"
              />

              <!-- Gradient Definition -->
              <defs>
                <linearGradient
                  id="db-gradient"
                  x1="0"
                  y1="0"
                  x2="100"
                  y2="0"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#3b82f6" />
                  <stop offset="0.5" stop-color="#2563eb" />
                  <stop offset="1" stop-color="#3b82f6" />
                </linearGradient>
              </defs>
            </svg>
            <!-- Label - Reduced text size from 2xl to xl and margin from mt-2 to mt-1 -->
            <div class="text-blue-300 font-bold text-xl mt-1">Postgres</div>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript to Draw Lines -->
    <script>
    // Utility function to get the current position and size of an element relative to the document
        function getRelativeRect(element) {
            const rect = element.getBoundingClientRect();
            return {
                top: rect.top,
                left: rect.left,
                right: rect.right,
                bottom: rect.bottom,
                width: rect.width,
                height: rect.height,
            };
        }
        
        function connectElements(startId, endId) {
            const svg = document.getElementById("connections");
            const startElem = document.getElementById(startId);
            const endElem = document.getElementById(endId);

            if (!startElem || !endElem) return;

            const startRect = getRelativeRect(startElem);
            const endRect = getRelativeRect(endElem);
            const containerRect = document.getElementById("main-container").getBoundingClientRect();

            // Calculate coordinates relative to the SVG container
            // Start point: Middle Right of start element
            const x1 = startRect.right - containerRect.left;
            const y1 = startRect.top + startRect.height / 2 - containerRect.top;

            // End point: Middle Left of end element
            const x2 = endRect.left - containerRect.left;
            const y2 = endRect.top + endRect.height / 2 - containerRect.top;

            // Create Bezier Curve
            // Control points for smooth S-curve
            // Use a fixed offset for the control points to ensure they extend slightly outside the elements
            const fixedOffset = 50; 
            const cx1 = x1 + fixedOffset;
            const cy1 = y1;
            const cx2 = x2 - fixedOffset;
            const cy2 = y2;

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // Use a smooth cubic Bezier curve (C)
            const d = `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
            
            path.setAttribute("d", d);
            path.setAttribute("class", "connection-path");
            path.setAttribute("marker-end", "url(#arrowhead)");
            
            svg.appendChild(path);
        }

        // Draw all connections
        function drawConnections() {
            const svg = document.getElementById("connections");
            // Clear existing paths (keep defs)
            const defs = svg.querySelector("defs");
            svg.innerHTML = '';
            svg.appendChild(defs);

            // 1. Port 5432 -> Postgres
            connectElements("node-db-port", "postgres-db");

            // 2. Auth API -> Better Auth
            connectElements("node-auth-api", "service-auth");

            // 3. Rest API -> PostgREST
            connectElements("node-rest-api", "service-postgrest");

            // 4. Better Auth -> Postgres
            connectElements("service-auth", "postgres-db");

            // 5. PostgREST -> Postgres
            connectElements("service-postgrest", "postgres-db");
        }

        // Initialize and handle resize
        window.addEventListener('load', drawConnections);
        window.addEventListener('resize', drawConnections);
        
        // Redraw after a slight delay to ensure fonts/layout are settled
        setTimeout(drawConnections, 100);
    </script>
  </body>
</html>
