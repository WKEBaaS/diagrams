<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure Diagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0; /* Slate 200 */
            overflow: hidden; 
        }
        
        .node-card {
            background: #1e293b; /* Slate 800 */
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155; /* Slate 700 */
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
            position: relative;
        }

        .node-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            border-color: #3b82f6;
        }

        .cluster-box {
            border: 2px dashed #475569; /* Slate 600 */
            border-radius: 16px;
            background-color: rgba(30, 41, 59, 0.3);
            position: relative;
        }

        .label-badge {
            background-color: #2563eb;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* SVG Overlay for lines */
        #connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .connection-line {
            stroke: #475569; /* Slate 600 */
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5;
            animation: dash 30s linear infinite;
        }

        .traffic-line {
            stroke: #22c55e; /* Green for healthy traffic */
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 8;
            animation: flow 1s linear infinite;
            opacity: 0.8;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: 1000;
            }
        }
        
        @keyframes flow {
            to {
                stroke-dashoffset: -16;
            }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-4 relative">

    <!-- SVG Container for connecting lines -->
    <svg id="connections"></svg>

    <!-- Header Info -->
    <div class="absolute top-8 left-8 bg-slate-800 p-4 rounded-lg shadow-lg border border-slate-700 z-20 text-slate-200">
        <h2 class="font-bold text-slate-100 mb-2">Traffic Rules</h2>
        <div class="text-sm text-slate-400 space-y-1">
            <div class="flex items-center gap-2">
                <i class="fas fa-globe text-blue-400"></i>
                <span>Domain: *.baas.wke.</span>
            </div>
            <div class="flex items-center gap-2">
                <i class="fas fa-network-wired text-green-400"></i>
                <span>Ports: 443 (HTTPS), 5432 (DB)</span>
            </div>
        </div>
    </div>

    <!-- Main Diagram Layout -->
    <div class="flex flex-col items-center gap-16 w-full max-w-6xl">
        
        <!-- Level 1: Load Balancer -->
        <div id="lb-node" class="node-card p-6 w-64 flex flex-col items-center gap-3 border-l-4 border-l-green-500">
            <div class="w-12 h-12 bg-green-900/30 rounded-full flex items-center justify-center text-green-400">
                <i class="fas fa-server text-xl"></i>
            </div>
            <div class="text-center">
                <h3 class="font-bold text-slate-100">Nginx Load Balancer</h3>
                <p class="text-xs text-slate-400 mt-1">Reverse Proxy</p>
            </div>
        </div>

        <!-- Level 2: Kubernetes Cluster -->
        <div class="cluster-box p-8 w-full">
            <div class="absolute -top-3 left-6 bg-slate-800 px-3 py-1 text-sm font-bold text-slate-300 rounded border border-slate-600">
                Kubernetes Cluster
            </div>
            
            <div class="flex flex-wrap justify-center gap-8 md:gap-16">
                
                <!-- Control Plane -->
                <div class="flex flex-col gap-4">
                    <div class="node-card p-6 w-56 flex flex-col items-center gap-3 border-l-4 border-l-purple-500 bg-purple-900/10">
                        <div class="w-12 h-12 bg-purple-900/30 rounded-full flex items-center justify-center text-purple-400">
                            <i class="fas fa-dharmachakra text-xl"></i>
                        </div>
                        <div class="text-center">
                            <h3 class="font-bold text-slate-100">Control Plane</h3>
                            <p class="text-xs text-slate-400 mt-1">API Server, Scheduler, etc.</p>
                        </div>
                    </div>
                </div>

                <!-- Worker Nodes -->
                <div class="flex gap-4 md:gap-8">
                    <!-- Worker 1 -->
                    <div id="worker-1" class="node-card p-6 w-48 flex flex-col items-center gap-3 border-l-4 border-l-blue-500">
                        <div class="w-10 h-10 bg-blue-900/30 rounded-full flex items-center justify-center text-blue-400">
                            <i class="fas fa-box text-lg"></i>
                        </div>
                        <div class="text-center">
                            <h3 class="font-bold text-slate-100">Worker Node 1</h3>
                            <div class="mt-2 flex gap-1 justify-center">
                                <span class="label-badge">App</span>
                                <span class="label-badge bg-indigo-600">DB</span>
                            </div>
                        </div>
                    </div>

                    <!-- Worker 2 -->
                    <div id="worker-2" class="node-card p-6 w-48 flex flex-col items-center gap-3 border-l-4 border-l-blue-500">
                        <div class="w-10 h-10 bg-blue-900/30 rounded-full flex items-center justify-center text-blue-400">
                            <i class="fas fa-box text-lg"></i>
                        </div>
                        <div class="text-center">
                            <h3 class="font-bold text-slate-100">Worker Node 2</h3>
                            <div class="mt-2 flex gap-1 justify-center">
                                <span class="label-badge">App</span>
                                <span class="label-badge bg-indigo-600">DB</span>
                            </div>
                        </div>
                    </div>

                    <!-- Worker 3 -->
                    <div id="worker-3" class="node-card p-6 w-48 flex flex-col items-center gap-3 border-l-4 border-l-blue-500">
                        <div class="w-10 h-10 bg-blue-900/30 rounded-full flex items-center justify-center text-blue-400">
                            <i class="fas fa-box text-lg"></i>
                        </div>
                        <div class="text-center">
                            <h3 class="font-bold text-slate-100">Worker Node 3</h3>
                            <div class="mt-2 flex gap-1 justify-center">
                                <span class="label-badge">App</span>
                                <span class="label-badge bg-indigo-600">DB</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Bottom Right Kubernetes Icon -->
    <div class="fixed bottom-6 right-6 flex items-center gap-3 opacity-80 hover:opacity-100 transition-opacity">
        <div class="text-right hidden sm:block">
            <div class="text-xs font-bold text-slate-500">POWERED BY</div>
            <div class="text-sm font-bold text-blue-400">KUBERNETES</div>
        </div>
        <!-- Kubernetes SVG Logo - Increased size to text-6xl -->
         <i class="devicon-kubernetes-plain colored text-6xl"></i>
    </div>

    <script>
        function drawLines() {
            const svg = document.getElementById('connections');
            const lb = document.getElementById('lb-node');
            const workers = [
                document.getElementById('worker-1'),
                document.getElementById('worker-2'),
                document.getElementById('worker-3')
            ];

            // Clear existing lines
            svg.innerHTML = '';

            // Get coordinates
            const lbRect = lb.getBoundingClientRect();
            const startX = lbRect.left + lbRect.width / 2;
            const startY = lbRect.bottom;

            workers.forEach(worker => {
                const wRect = worker.getBoundingClientRect();
                const endX = wRect.left + wRect.width / 2;
                const endY = wRect.top;

                // Create curved path
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                
                // Calculate control points for Bezier curve
                const controlY1 = startY + (endY - startY) / 2;
                const controlY2 = startY + (endY - startY) / 2;

                const d = `M ${startX} ${startY} C ${startX} ${controlY1}, ${endX} ${controlY2}, ${endX} ${endY}`;

                // Background line (grey)
                path.setAttribute("d", d);
                path.setAttribute("class", "connection-line");
                svg.appendChild(path);

                // Traffic line (animated green)
                const trafficPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                trafficPath.setAttribute("d", d);
                trafficPath.setAttribute("class", "traffic-line");
                svg.appendChild(trafficPath);

                // Add arrowhead
                const arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                arrow.setAttribute("points", `${endX},${endY} ${endX-5},${endY-10} ${endX+5},${endY-10}`);
                arrow.setAttribute("fill", "#22c55e");
                svg.appendChild(arrow);
            });
        }

        // Initial draw
        window.addEventListener('load', drawLines);
        // Redraw on resize
        window.addEventListener('resize', drawLines);
    </script>
</body>
</html>
